name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Least privilege for every job; deploy adds packages: write for GHCR.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (Dependabot keeps them current):
# a moved tag could otherwise run code in a job on main.
jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Deploys main to production with Kamal once every check above passes.
  # Pull requests (including forks) never reach this job, and its secrets live
  # in the "production" environment, which only main may deploy from. Secrets
  # are passed to the deploy step alone; the server's IP is a secret too, so
  # GitHub masks it in this public log. See docs/DEPLOYMENT.md.
  # Only the upstream repository deploys, so forks don't get a failing deploy
  # job on every push. To deploy your own fork from CI, change the repository
  # name below to yours (docs/DEPLOYMENT.md › "Deploying from a fork").
  deploy:
    needs: [ scan_ruby, scan_js, lint, test, system-test ]
    if: github.repository == 'creativesorcery/goodsorcery_web' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.GOODSORCERY_HOST }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          bundler-cache: true
          # Its own gem cache: never run gems a check job wrote to the shared
          # cache while holding the production secrets.
          cache-version: deploy

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Refuse unknown or changed host keys instead of trusting on first use,
          # and fail with an auth error instead of hanging on a password prompt.
          printf 'Host *\n  StrictHostKeyChecking yes\n  PreferredAuthentications publickey\n' > ~/.ssh/config

      - name: Deploy with Kamal
        env:
          KAMAL_WEB_HOST: ${{ secrets.KAMAL_WEB_HOST }}
          KAMAL_SSH_PORT: ${{ secrets.KAMAL_SSH_PORT }}
          KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER || 'deploy' }}
          GOODSORCERY_HOST: ${{ vars.GOODSORCERY_HOST }}
          GOODSORCERY_MAIL_FROM: ${{ vars.GOODSORCERY_MAIL_FROM }}
          GOODSORCERY_ENABLE_SIGNUPS: ${{ vars.GOODSORCERY_ENABLE_SIGNUPS }}
          GOODSORCERY_DISABLE_SIGNUPS: ${{ vars.GOODSORCERY_DISABLE_SIGNUPS }}
          GOODSORCERY_HOSTED: ${{ vars.GOODSORCERY_HOSTED }}
          GOODSORCERY_APM_RETENTION_DAYS: ${{ vars.GOODSORCERY_APM_RETENTION_DAYS }}
          GOODSORCERY_UPGRADE_URL: ${{ vars.GOODSORCERY_UPGRADE_URL }}
          GOODSORCERY_TERMS_URL: ${{ vars.GOODSORCERY_TERMS_URL }}
          GOODSORCERY_PRIVACY_URL: ${{ vars.GOODSORCERY_PRIVACY_URL }}
          GOODSORCERY_ENDPOINT: ${{ vars.GOODSORCERY_ENDPOINT }}
          GOODSORCERY_PERFORMANCE_MONITORING: ${{ vars.GOODSORCERY_PERFORMANCE_MONITORING }}
          # The GHCR image (without ghcr.io/). Defaults to this repository's
          # name, lowercased below, so a fork pushes to its own package.
          KAMAL_IMAGE: ${{ vars.KAMAL_IMAGE }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          GOODSORCERY_WEB_DATABASE_PASSWORD: ${{ secrets.GOODSORCERY_WEB_DATABASE_PASSWORD }}
          POSTMARK_API_TOKEN: ${{ secrets.POSTMARK_API_TOKEN }}
          GOODSORCERY_API_KEY: ${{ secrets.GOODSORCERY_API_KEY }}
        run: |
          missing=0
          # POSTMARK_API_TOKEN is optional: without it, mail goes through the
          # SMTP settings in config/environments/production.rb (README › Email).
          for name in KAMAL_WEB_HOST KAMAL_SSH_PORT GOODSORCERY_HOST SECRET_KEY_BASE ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY \
                      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT \
                      GOODSORCERY_WEB_DATABASE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in the production environment"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          [ -n "$POSTMARK_API_TOKEN" ] || echo "::warning::POSTMARK_API_TOKEN is not set; mail needs SMTP configured instead"
          export KAMAL_IMAGE="${KAMAL_IMAGE:-${GITHUB_REPOSITORY,,}}"
          bin/kamal deploy

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
