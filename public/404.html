<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page not found (404) — Good Sorcery</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/icon.png" type="image/png">
    <!-- Static page (public/404.html): its styles are here because the app's stylesheet has a digested name. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
        background: #f7f6f3;
        color: #34374d;
        font-family: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 420px);
        padding: 2rem 1.5rem;
        border: 1px solid #e7e5df;
        border-radius: 16px;
        background: #fff;
        text-align: center;
      }
      .sigil { display: block; width: 40px; height: 40px; margin: 0 auto 1.25rem; }
      .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #80849a; }
      h1 {
        margin-top: .5rem;
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
        font-size: 24px;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: #23253a;
        overflow-wrap: break-word;
      }
      p { margin-top: .75rem; color: #62667e; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        margin-top: 1.5rem;
        padding: 0 1rem;
        border-radius: .5rem;
        background: #e6e7ff;
        color: #4b50c4;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #dcdefd; }
    </style>
  </head>
  <body>
    <main>
      <svg class="sigil" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#e4e6ff"/>
        <circle cx="22.5" cy="9.5" r="4" fill="#ffd3d7"/>
        <path d="M15 6.5c.9 4.6 2.9 6.6 7.5 7.5-4.6.9-6.6 2.9-7.5 7.5-.9-4.6-2.9-6.6-7.5-7.5 4.6-.9 6.6-2.9 7.5-7.5Z" fill="#5b60d1"/>
        <circle cx="22" cy="23" r="2.2" fill="#5cc29a"/>
      </svg>
      <div class="eyebrow">404 · Page not found</div>
      <h1>This page doesn't exist</h1>
      <p>The address may be mistyped, or the page may have moved. If you run this instance, the logs have the details.</p>
      <a href="/">Back to Good Sorcery</a>
    </main>
  </body>
</html>
