# Digests of PAT_FIXTURE_TOKENS (test/test_helper.rb); the plaintext is never stored.
<% digest = ->(name) { OpenSSL::Digest::SHA256.hexdigest(PAT_FIXTURE_TOKENS.fetch(name)) } %>
<% last4 = ->(name) { PAT_FIXTURE_TOKENS.fetch(name).last(4) } %>

alex_read:
  user: alex
  account: acme
  name: Laptop
  scopes: [read]
  token_digest: <%= digest.(:alex_read) %>
  token_last4: <%= last4.(:alex_read) %>
  expires_at: <%= 80.days.from_now.to_fs(:db) %>
  created_at: <%= 10.days.ago.to_fs(:db) %>

alex_triage:
  user: alex
  account: acme
  name: Claude Code
  scopes: [read, triage]
  token_digest: <%= digest.(:alex_triage) %>
  token_last4: <%= last4.(:alex_triage) %>
  expires_at: <%= 80.days.from_now.to_fs(:db) %>
  last_used_at: <%= 2.hours.ago.to_fs(:db) %>
  created_at: <%= 9.days.ago.to_fs(:db) %>

