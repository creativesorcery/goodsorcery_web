# Scheduled jobs, loaded by sidekiq-cron when a Sidekiq process starts
# (production only; development and test don't run Sidekiq). Times are UTC.
# Jobs removed from this file are unscheduled on the next Sidekiq start.

prune_expired_data:
  cron: "17 3 * * *"   # daily at 03:17
  class: PruneExpiredDataJob
  description: "Delete data past each project's retention (goodsorcery:prune)"

requeue_stale_events:
  cron: "*/10 * * * *"
  class: RequeueStaleEventsJob
  description: "Re-enqueue inbound events never processed (goodsorcery:requeue_stale)"

check_still_happening:
  cron: "*/5 * * * *"
  class: CheckStillHappeningJob
  description: "Still-happening alerts for issues over their app threshold in the last hour"

send_daily_digests:
  cron: "0 * * * *"   # hourly: each run mails the members whose local time is 09:xx
  class: SendDailyDigestsJob
  description: "Daily alert digests at 09:00 in each recipient time zone"

send_alert_summaries:
  cron: "2 * * * *"   # just after each hour
  class: SendAlertSummariesJob
  description: "One and-N-more email per user for alerts folded over the hourly cap"

cap_stored_occurrences:
  cron: "*/5 * * * *"
  class: CapStoredOccurrencesJob
  description: "Trim each app to its stored occurrence cap, most repeated issues first"
