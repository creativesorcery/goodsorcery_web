# Kamal deploy for a single server running the web app, Sidekiq, Postgres,
# Redis and a Cloudflare Tunnel. See docs/DEPLOYMENT.md.
#
# This file is public, so it holds no hosts, IPs or secrets. Kamal reads it
# through ERB: hosts and names come from ENV, and secrets from .kamal/secrets.
# CI deploys on every push to main (.github/workflows/ci.yml).
#
# The server publishes no HTTP ports. cloudflared (the "tunnel" accessory)
# connects out to Cloudflare and forwards requests to kamal-proxy over the
# private "kamal" Docker network, so the server's IP never appears in DNS.

<% web_host = ENV.fetch("KAMAL_WEB_HOST") %>

service: goodsorcery_web

image: <%= ENV.fetch("KAMAL_IMAGE", "creativesorcery/goodsorcery_web") %>

servers:
  web:
    - <%= web_host %>
  job:
    hosts:
      - <%= web_host %>
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Cloudflare terminates TLS; the tunnel reaches kamal-proxy over plain HTTP.
# production.rb sets assume_ssl and force_ssl, so Rails still treats every
# request as HTTPS.
proxy:
  ssl: false
  host: <%= ENV.fetch("GOODSORCERY_HOST") %>
  # Keep the client IP that Cloudflare put in X-Forwarded-For (rate limits
  # and sessions use request.remote_ip).
  forward_headers: true
  run:
    # Don't publish 80/443 on the host: Docker-published ports bypass the
    # firewall, and only cloudflared (on the kamal network) needs the proxy.
    publish: false

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "deploy") %>
  port: <%= ENV.fetch("KAMAL_SSH_PORT", 22) %>

env:
  clear:
    GOODSORCERY_PUBLIC_URL: https://<%= ENV.fetch("GOODSORCERY_HOST") %>
    DB_HOST: goodsorcery_web-db
    REDIS_URL: redis://goodsorcery_web-redis:6379/0
<% if ENV["GOODSORCERY_MAIL_FROM"].to_s.strip != "" %>
    GOODSORCERY_MAIL_FROM: <%= ENV["GOODSORCERY_MAIL_FROM"].to_json %>
<% end %>
  secret:
    - SECRET_KEY_BASE
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - GOODSORCERY_WEB_DATABASE_PASSWORD
    - POSTMARK_API_TOKEN

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Local Active Storage files.
volumes:
  - "goodsorcery_web_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

builder:
  arch: amd64
  # Layer cache in the registry, so CI builds reuse unchanged layers.
  cache:
    type: registry
    image: <%= ENV.fetch("KAMAL_IMAGE", "creativesorcery/goodsorcery_web") %>-build-cache
    options: mode=max

# Accessories run on the kamal Docker network and publish no ports, so they're
# reachable from the app containers by name (goodsorcery_web-db, ...) but not
# from outside the server. `bin/kamal setup` boots them; `bin/kamal deploy`
# leaves them running.
accessories:
  db:
    image: postgres:18
    host: <%= web_host %>
    env:
      clear:
        POSTGRES_USER: goodsorcery_web
        POSTGRES_DB: goodsorcery_web_production
      secret:
        - POSTGRES_PASSWORD:GOODSORCERY_WEB_DATABASE_PASSWORD
    directories:
      - data:/var/lib/postgresql

  redis:
    image: redis:8
    host: <%= web_host %>
    cmd: redis-server --appendonly yes
    directories:
      - data:/data

  # Remotely managed tunnel: its public hostname is configured in the
  # Cloudflare dashboard to point at http://kamal-proxy:80.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    host: <%= web_host %>
    cmd: tunnel run
    env:
      secret:
        - TUNNEL_TOKEN:CLOUDFLARE_TUNNEL_TOKEN
