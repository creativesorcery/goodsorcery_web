# Sidekiq runs Active Job in production. Redis connection comes from REDIS_URL.
# Weighted queues: ingest is drained first, but never starves the others.
# alerts holds the alert jobs and sweeps (the emails go through mailers).
# apm holds the short, database-bound performance batches.
# uptime holds the I/O-bound checks (up to about 20 s each); their
# every-minute scheduler runs on default so it never waits behind them. See
# docs/DEPLOYMENT.md to give uptime its own process.
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>
:queues:
  - [ingest, 3]
  - [apm, 2]
  - [default, 2]
  - [alerts, 2]
  - [uptime, 2]
  - [mailers, 1]
